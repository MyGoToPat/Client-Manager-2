<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Start Your Free Trial — Hire Pat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        pat: { purple: '#8B5CF6', orange: '#F97316' },
                    },
                },
            },
        }
    </script>
    <style>
        body { background: linear-gradient(180deg, #0f0f1a 0%, #080810 100%); font-family: 'Inter', sans-serif; }
        .gradient-text { background: linear-gradient(135deg, #8B5CF6 0%, #A78BFA 50%, #F97316 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .cta-glow { box-shadow: 0 0 30px rgba(249, 115, 22, 0.4); }
    </style>
</head>
<body class="text-white min-h-screen flex items-center justify-center p-4">

    <!-- MODAL BACKDROP -->
    <div class="fixed inset-0 bg-black/60 backdrop-blur-sm"></div>

    <!-- SIGNUP MODAL -->
    <div class="relative z-10 max-w-lg w-full">
        <div class="bg-white/5 backdrop-blur-lg rounded-2xl border border-white/10 p-6 md:p-8 shadow-2xl">

            <!-- Close Button -->
            <button class="absolute top-4 right-4 text-gray-400 hover:text-white transition-colors">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>

            <!-- Header -->
            <div class="text-center mb-6">
                <div class="flex justify-center mb-4">
                    <div class="w-16 h-16 rounded-full bg-gradient-to-br from-pat-purple via-purple-500 to-pat-orange flex items-center justify-center">
                        <div class="flex gap-2.5">
                            <div class="w-2 h-2.5 bg-white rounded-full"></div>
                            <div class="w-2 h-2.5 bg-white rounded-full"></div>
                        </div>
                    </div>
                </div>
                <h2 class="text-2xl font-bold text-white mb-2">Hire Pat — 14 Days Free</h2>
                <p class="text-gray-400 text-sm">No credit card required. Cancel anytime.</p>
            </div>

            <!-- Urgency Banner -->
            <div class="bg-pat-orange/10 border border-pat-orange/30 rounded-lg p-3 mb-6 text-center">
                <p class="text-sm text-pat-orange font-medium">
                    <span class="inline-block w-2 h-2 bg-pat-orange rounded-full animate-pulse mr-2"></span>
                    Only 47 founding spots left at this price
                </p>
            </div>

            <!-- Form -->
            <form class="space-y-5">
                <!-- Name -->
                <div>
                    <label for="signup-name" class="block text-sm font-medium text-gray-300 mb-1.5">Your Name</label>
                    <input type="text" id="signup-name" placeholder="First and last name" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-lg text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-pat-purple focus:border-transparent transition-all">
                </div>

                <!-- Email -->
                <div>
                    <label for="signup-email" class="block text-sm font-medium text-gray-300 mb-1.5">Work Email</label>
                    <input type="email" id="signup-email" placeholder="you@example.com" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-lg text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-pat-purple focus:border-transparent transition-all">
                </div>

                <!-- Business Type -->
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-3">What best describes you?</label>
                    <div class="grid grid-cols-2 gap-3">
                        <label class="type-option relative flex items-center justify-center px-4 py-3 rounded-lg border cursor-pointer transition-all bg-white/5 border-white/10 text-gray-400 hover:border-white/20 hover:text-white">
                            <input type="radio" name="business_type" value="solo" class="sr-only" onchange="toggleType(this)">
                            <div class="text-center">
                                <span class="text-xl mb-1 block">👤</span>
                                <span class="text-sm font-medium">Solo Trainer</span>
                            </div>
                        </label>
                        <label class="type-option relative flex items-center justify-center px-4 py-3 rounded-lg border cursor-pointer transition-all bg-white/5 border-white/10 text-gray-400 hover:border-white/20 hover:text-white">
                            <input type="radio" name="business_type" value="online" class="sr-only" onchange="toggleType(this)">
                            <div class="text-center">
                                <span class="text-xl mb-1 block">💻</span>
                                <span class="text-sm font-medium">Online Coach</span>
                            </div>
                        </label>
                        <label class="type-option relative flex items-center justify-center px-4 py-3 rounded-lg border cursor-pointer transition-all bg-white/5 border-white/10 text-gray-400 hover:border-white/20 hover:text-white">
                            <input type="radio" name="business_type" value="gym" class="sr-only" onchange="toggleType(this)">
                            <div class="text-center">
                                <span class="text-xl mb-1 block">🏋️</span>
                                <span class="text-sm font-medium">Gym/Studio</span>
                            </div>
                        </label>
                        <label class="type-option relative flex items-center justify-center px-4 py-3 rounded-lg border cursor-pointer transition-all bg-white/5 border-white/10 text-gray-400 hover:border-white/20 hover:text-white">
                            <input type="radio" name="business_type" value="other" class="sr-only" onchange="toggleType(this)">
                            <div class="text-center">
                                <span class="text-xl mb-1 block">📋</span>
                                <span class="text-sm font-medium">Other</span>
                            </div>
                        </label>
                    </div>
                </div>

                <!-- Client Count -->
                <div>
                    <label for="client-count" class="block text-sm font-medium text-gray-300 mb-1.5">How many clients do you have?</label>
                    <select id="client-count" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-lg text-white focus:outline-none focus:ring-2 focus:ring-pat-purple focus:border-transparent transition-all">
                        <option value="" class="bg-gray-900">Select range...</option>
                        <option value="1-10" class="bg-gray-900">1-10 clients</option>
                        <option value="11-25" class="bg-gray-900">11-25 clients</option>
                        <option value="26-50" class="bg-gray-900">26-50 clients</option>
                        <option value="51-100" class="bg-gray-900">51-100 clients</option>
                        <option value="100+" class="bg-gray-900">100+ clients</option>
                    </select>
                </div>

                <!-- Submit -->
                <div class="pt-2">
                    <button type="submit" class="w-full bg-gradient-to-r from-pat-orange to-orange-500 hover:from-orange-500 hover:to-pat-orange text-white font-bold py-4 rounded-full cta-glow transition-all hover:scale-105">
                        Start My 14-Day Free Trial
                    </button>
                </div>

                <!-- Trust Indicators -->
                <div class="flex flex-wrap items-center justify-center gap-4 text-xs text-gray-500">
                    <span class="flex items-center gap-1">
                        <svg class="w-3 h-3 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                        No credit card
                    </span>
                    <span class="flex items-center gap-1">
                        <svg class="w-3 h-3 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                        Full access
                    </span>
                    <span class="flex items-center gap-1">
                        <svg class="w-3 h-3 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                        Cancel anytime
                    </span>
                </div>

                <p class="text-xs text-gray-500 text-center">
                    By signing up, you agree to our <a href="#" class="text-pat-purple hover:text-white">Terms of Service</a> and <a href="#" class="text-pat-purple hover:text-white">Privacy Policy</a>
                </p>
            </form>

            <!-- Social Proof -->
            <div class="mt-6 pt-6 border-t border-white/10">
                <div class="flex items-center justify-center gap-3">
                    <div class="flex -space-x-2">
                        <div class="w-8 h-8 rounded-full bg-gradient-to-br from-blue-400 to-blue-600 border-2 border-gray-900 flex items-center justify-center text-xs font-bold text-white">D</div>
                        <div class="w-8 h-8 rounded-full bg-gradient-to-br from-green-400 to-green-600 border-2 border-gray-900 flex items-center justify-center text-xs font-bold text-white">M</div>
                        <div class="w-8 h-8 rounded-full bg-gradient-to-br from-purple-400 to-purple-600 border-2 border-gray-900 flex items-center justify-center text-xs font-bold text-white">J</div>
                    </div>
                    <p class="text-sm text-gray-400">
                        <span class="text-white font-medium">347 trainers</span> already hired Pat
                    </p>
                </div>
            </div>
        </div>
    </div>

    <script>
        function toggleType(radio) {
            // Reset all
            document.querySelectorAll('.type-option').forEach(label => {
                label.classList.remove('bg-gradient-to-r', 'from-pat-purple/20', 'to-pat-orange/20', 'border-pat-purple', 'text-white');
                label.classList.add('bg-white/5', 'border-white/10', 'text-gray-400');
            });
            // Highlight selected
            if (radio.checked) {
                const label = radio.closest('.type-option');
                label.classList.add('bg-gradient-to-r', 'from-pat-purple/20', 'to-pat-orange/20', 'border-pat-purple', 'text-white');
                label.classList.remove('bg-white/5', 'border-white/10', 'text-gray-400');
            }
        }
    </script>
</body>
</html>
